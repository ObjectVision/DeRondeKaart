<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Embed Test — Map Controls</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f3f4f6; padding: 16px; height: 100vh; display: flex; flex-direction: column; gap: 12px; }
    h1 { font-size: 18px; color: #1f2937; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; }
    .group { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; }
    .group h2 { font-size: 13px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
    .group .buttons { display: flex; flex-wrap: wrap; gap: 4px; }
    button { padding: 6px 12px; font-size: 13px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; cursor: pointer; transition: background 0.15s; }
    button:hover { background: #f9fafb; }
    button.add { border-color: #86efac; color: #166534; }
    button.add:hover { background: #f0fdf4; }
    button.remove { border-color: #fca5a5; color: #991b1b; }
    button.remove:hover { background: #fef2f2; }
    button.hide { border-color: #fde68a; color: #92400e; }
    button.hide:hover { background: #fffbeb; }
    button.refresh { border-color: #93c5fd; color: #1e40af; }
    button.refresh:hover { background: #eff6ff; }
    button.view { border-color: #c4b5fd; color: #5b21b6; }
    button.view:hover { background: #f5f3ff; }
    iframe { flex: 1; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; }
    .log { font-size: 12px; color: #6b7280; padding: 4px 0; max-height: 40px; overflow-y: auto; }
  </style>
</head>
<body>
  <h1>Iframe Embed Test</h1>

  <div class="controls">
    <div class="group">
      <h2>Map A</h2>
      <div class="buttons">
        <button class="add" onclick="send('add','a','gemeente')">+ Gemeenten</button>
        <button class="add" onclick="send('add','a','wijken-limburg-parquet')">+ Wijken (Parquet)</button>
        <button class="add" onclick="send('add','a','vrz-limburg')">+ VRZ Limburg</button>
        <button class="add" onclick="send('add','a','huisarts')">+ Huisartsen</button>
        <button class="add" onclick="send('add','a','example-polygons')">+ Example Polygons</button>
        <button class="add" onclick="send('add','a','example-mvt')">+ OpenMapTiles</button>
        <button class="add" onclick="send('add','a','WZW5')">+ WZW5</button>
        <button class="add" onclick="send('add','a','example-cog')">+ Example COG</button>
        <button class="remove" onclick="send('remove','a','gemeente')">- Gemeenten</button>
        <button class="remove" onclick="send('remove','a','wijken-limburg-parquet')">- Wijken (Parquet)</button>
        <button class="remove" onclick="send('remove','a','vrz-limburg')">- VRZ Limburg</button>
        <button class="remove" onclick="send('remove','a','huisarts')">- Huisartsen</button>
        <button class="remove" onclick="send('remove','a','example-polygons')">- Example Polygons</button>
        <button class="remove" onclick="send('remove','a','example-mvt')">- OpenMapTiles</button>
        <button class="remove" onclick="send('remove','a','WZW5')">- WZW5</button>
        <button class="remove" onclick="send('remove','a','example-cog')">- Example COG</button>
        <button class="hide" onclick="send('hide','a','gemeente')">Hide Gemeenten</button>
        <button class="hide" onclick="send('hide','a','WZW5')">Hide WZW5</button>
      </div>
    </div>

    <div class="group">
      <h2>Map B</h2>
      <div class="buttons">
        <button class="add" onclick="send('add','b','gemeente')">+ Gemeenten</button>
        <button class="add" onclick="send('add','b','wijken-limburg-parquet')">+ Wijken (Parquet)</button>
        <button class="add" onclick="send('add','b','vrz-limburg')">+ VRZ Limburg</button>
        <button class="add" onclick="send('add','b','huisarts')">+ Huisartsen</button>
        <button class="add" onclick="send('add','b','example-polygons')">+ Example Polygons</button>
        <button class="add" onclick="send('add','b','example-mvt')">+ OpenMapTiles</button>
        <button class="add" onclick="send('add','b','WZW5')">+ WZW5</button>
        <button class="add" onclick="send('add','b','example-cog')">+ Example COG</button>
        <button class="remove" onclick="send('remove','b','gemeente')">- Gemeenten</button>
        <button class="remove" onclick="send('remove','b','wijken-limburg-parquet')">- Wijken (Parquet)</button>
        <button class="remove" onclick="send('remove','b','vrz-limburg')">- VRZ Limburg</button>
        <button class="remove" onclick="send('remove','b','huisarts')">- Huisartsen</button>
        <button class="remove" onclick="send('remove','b','example-polygons')">- Example Polygons</button>
        <button class="remove" onclick="send('remove','b','example-mvt')">- OpenMapTiles</button>
        <button class="remove" onclick="send('remove','b','WZW5')">- WZW5</button>
        <button class="remove" onclick="send('remove','b','example-cog')">- Example COG</button>
        <button class="hide" onclick="send('hide','b','gemeente')">Hide Gemeenten</button>
        <button class="hide" onclick="send('hide','b','WZW5')">Hide WZW5</button>
      </div>
    </div>

    <div class="group">
      <h2>View</h2>
      <div class="buttons">
        <button class="view" onclick="sendView({ zoom: 6 })">Zoom 6</button>
        <button class="view" onclick="sendView({ zoom: 8 })">Zoom 8</button>
        <button class="view" onclick="sendView({ zoom: 10 })">Zoom 10</button>
        <button class="view" onclick="sendView({ zoom: 12 })">Zoom 12</button>
        <button class="view" onclick="sendView({ center: [5.7, 51.0] })">Center Limburg</button>
        <button class="view" onclick="sendView({ center: [4.9, 52.37] })">Center Amsterdam</button>
        <button class="view" onclick="sendView({ center: [5.0, 52.0] })">Center NL</button>
        <button class="view" onclick="sendView({ zoom: 9, center: [5.7, 51.0] })">Limburg @ 9</button>
        <button class="view" onclick="sendView({ zoom: 11, center: [5.69, 50.85] })">Maastricht @ 11</button>
      </div>
    </div>

    <div class="group">
      <h2>Global</h2>
      <div class="buttons">
        <button class="refresh" onclick="send('refresh')">Refresh</button>
      </div>
    </div>
  </div>

  <div class="log" id="log">Ready</div>

  <iframe id="map" src="http://localhost:5173/" allow="fullscreen"></iframe>

  <script>
    const iframe = document.getElementById('map');
    const log = document.getElementById('log');

    function send(cmd, map, layer) {
      const command = { cmd };
      if (map) command.map = map;
      if (layer) command.layer = layer;

      iframe.contentWindow.postMessage(
        { type: 'map-command', commands: [command] },
        '*'
      );

      log.textContent = `Sent: ${JSON.stringify(command)}`;
    }

    function sendView(view) {
      iframe.contentWindow.postMessage(
        { type: 'map-command', view },
        '*'
      );

      log.textContent = `Sent view: ${JSON.stringify(view)}`;
    }
  </script>
</body>
</html>
