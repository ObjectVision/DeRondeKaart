<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Embed Test — Map Controls</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f3f4f6; padding: 16px; height: 100vh; display: flex; flex-direction: column; gap: 12px; }
    h1 { font-size: 18px; color: #1f2937; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; }
    .group { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; }
    .group h2 { font-size: 13px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
    .group .buttons { display: flex; flex-wrap: wrap; gap: 4px; }
    button { padding: 6px 12px; font-size: 13px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; cursor: pointer; transition: background 0.15s; }
    button:hover { background: #f9fafb; }
    button.add { border-color: #86efac; color: #166534; }
    button.add:hover { background: #f0fdf4; }
    button.remove { border-color: #fca5a5; color: #991b1b; }
    button.remove:hover { background: #fef2f2; }
    button.hide { border-color: #fde68a; color: #92400e; }
    button.hide:hover { background: #fffbeb; }
    button.refresh { border-color: #93c5fd; color: #1e40af; }
    button.refresh:hover { background: #eff6ff; }
    button.view { border-color: #c4b5fd; color: #5b21b6; }
    button.view:hover { background: #f5f3ff; }
    button.share { border-color: #f9a8d4; color: #9d174d; }
    button.share:hover { background: #fdf2f8; }
    .group .fields { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
    .group input { padding: 5px 8px; font-size: 13px; border: 1px solid #d1d5db; border-radius: 6px; min-width: 220px; }
    .group input:focus { outline: none; border-color: #f9a8d4; }
    iframe { flex: 1; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; }
    .log { font-size: 12px; color: #6b7280; padding: 4px 0; max-height: 40px; overflow-y: auto; }
  </style>
</head>
<body>

    <div class="group">
      <h2>View</h2>
      <div class="buttons">
        <button class="view" onclick="sendView({ zoom: 6 })">Zoom 6</button>
        <button class="view" onclick="sendView({ zoom: 8 })">Zoom 8</button>
        <button class="view" onclick="sendView({ zoom: 10 })">Zoom 10</button>
        <button class="view" onclick="sendView({ zoom: 12 })">Zoom 12</button>
        <button class="view" onclick="sendView({ center: [5.7, 51.0] })">Center Limburg</button>
        <button class="view" onclick="sendView({ center: [4.9, 52.37] })">Center Amsterdam</button>
        <button class="view" onclick="sendView({ center: [5.0, 52.0] })">Center NL</button>
        <button class="view" onclick="sendView({ zoom: 9, center: [5.7, 51.0] })">Limburg @ 9</button>
        <button class="view" onclick="sendView({ zoom: 11, center: [5.69, 50.85] })">Maastricht @ 11</button>
      </div>
    </div>

    <div class="group">
      <h2>Ronde kaart (circular export)</h2>
      <div class="fields">
        <input id="share-title" type="text" placeholder="Titel" value="Zorgvraag Limburg">
        <input id="share-subtitle" type="text" placeholder="Ondertitel (optioneel)" value="Startanalyse 2026">
        <input id="share-layers" type="text" placeholder="Laag-ids, komma-gescheiden" value="gemeente,huisarts">
      </div>
      <div class="buttons">
        <!-- open-circular: replaces the app with only the circular map + legend + title. -->
        <button class="share" onclick="sendOpenCircular()">Toon ronde kaart</button>
        <button class="share" onclick="sendOpenCircular({ withView: true })">Toon + zoom Limburg</button>
        <button class="share" onclick="sendOpenCircular({ layers: [] })">Toon (geen lagen)</button>
        <!-- Standalone embed page: loads ?embed=circular in the embed iframe
             below, then pushes the same layers/title/view into it. -->
        <button class="share" onclick="openStandaloneEmbed()">Open standalone embed →</button>
      </div>
    </div>

    <div class="group">
      <h2>Gebiedsfilter (woonzorglimburg)</h2>
      <div class="fields">
        <!-- CBS codes (gm_code / wk_code) OR labels ("Weert"). Leave blank to
             clear a level. Buurt is not in this config's filter.json. -->
        <input id="filter-gemeente" type="text" placeholder="Gemeente (code of naam)" value="Weert">
        <input id="filter-wijk" type="text" placeholder="Wijk (code of naam)" value="">
      </div>
      <div class="buttons">
        <button class="share" onclick="sendFilterOnly()">Zet gebiedsfilter</button>
        <button class="share" onclick="sendOpenCircular({ withFilter: true })">Ronde kaart + gebiedsfilter</button>
        <button class="share" onclick="sendFilterOnly(true)">Wis gebiedsfilter</button>
      </div>
    </div>

    <div class="group">
      <h2>Circular embed — stepwise filter</h2>
      <div class="fields">
        <!-- Codes (gm_code / wk_code / bu_code) OR labels. Buurt needs a Buurt
             entry in configs/woonzorglimburg/filter.json to resolve. -->
        <input id="step-gemeente" type="text" placeholder="Gemeente (code of naam)" value="GM0957">
        <input id="step-wijk" type="text" placeholder="Wijk (code of naam)" value="WK095700">
        <input id="step-buurt" type="text" placeholder="Buurt (code of naam)" value="BU09570000">
      </div>
      <div class="buttons">
        <!-- Step 0: load the circular embed with the full filter (zooms in). -->
        <button class="share" onclick="openStepEmbed()">1· Open embed + filter</button>
        <!-- Each step posts a filter change to the embed iframe. -->
        <button class="share" onclick="stepRemove('Buurt')">2· Verwijder buurt →wijk</button>
        <button class="share" onclick="stepRemove('Wijk')">3· Verwijder wijk →gemeente</button>
        <button class="share" onclick="stepRemove('Gemeente')">4· Verwijder gemeente →start</button>
      </div>
    </div>

    <div class="group">
      <h2>Global</h2>
      <div class="buttons">
        <button class="refresh" onclick="send('refresh')">Refresh</button>
      </div>
    </div>

  <div class="log" id="log">Ready</div>

  <div style="flex: 1; display: flex; gap: 8px; min-height: 0;">
    <iframe id="map" style="flex: 1;" src="http://localhost:5173/" allow="fullscreen"></iframe>
    <!-- Standalone circular embed (?embed=circular). Hidden until opened. -->
    <iframe id="embed" style="flex: 1; display: none;" allow="fullscreen"></iframe>
  </div>

  <script>
    const iframe = document.getElementById('map');
    const embedFrame = document.getElementById('embed');
    const log = document.getElementById('log');

    function send(cmd, map, layer) {
      const command = { cmd };
      if (map) command.map = map;
      if (layer) command.layer = layer;

      iframe.contentWindow.postMessage(
        { type: 'map-command', commands: [command] },
        '*'
      );

      log.textContent = `Sent: ${JSON.stringify(command)}`;
    }

    function sendView(view) {
      iframe.contentWindow.postMessage(
        { type: 'map-command', view },
        '*'
      );

      log.textContent = `Sent view: ${JSON.stringify(view)}`;
    }

    // Build the gebiedsfilter object from the inputs. `clear` empties every
    // level. Only non-empty levels are included otherwise.
    function buildFilter(clear = false) {
      const gemeente = document.getElementById('filter-gemeente').value.trim();
      const wijk = document.getElementById('filter-wijk').value.trim();
      if (clear) return { Gemeente: null, Wijk: null };
      const filter = {};
      if (gemeente) filter.Gemeente = gemeente;
      if (wijk) filter.Wijk = wijk;
      return filter;
    }

    // Build the open-circular message from the current inputs. `opts.layers`
    // overrides the input field; `opts.withView` also frames Limburg;
    // `opts.withFilter` attaches the gebiedsfilter.
    function buildOpenCircular(opts = {}) {
      const message = { type: 'open-circular' };

      const title = document.getElementById('share-title').value;
      const subtitle = document.getElementById('share-subtitle').value;
      if (title) message.title = title;
      if (subtitle) message.subtitle = subtitle;

      message.layers = opts.layers ?? document.getElementById('share-layers').value
        .split(',')
        .map((s) => s.trim())
        .filter(Boolean);

      if (opts.withView) message.view = { zoom: 9, center: [5.7, 51.0] };
      if (opts.withFilter) message.filter = buildFilter();
      return message;
    }

    // Set the gebiedsfilter only (via map-command), without touching the
    // circular view. `clear` empties every level instead.
    function sendFilterOnly(clear = false) {
      const filter = buildFilter(clear);
      iframe.contentWindow.postMessage({ type: 'map-command', filter }, '*');
      log.textContent = `Sent filter: ${JSON.stringify(filter)}`;
    }

    // Replace the running app with only the circular map + legend + title (no
    // map chrome, no dialog/social).
    function sendOpenCircular(opts = {}) {
      const message = buildOpenCircular(opts);
      iframe.contentWindow.postMessage(message, '*');
      log.textContent = `Sent open-circular: ${JSON.stringify(message)}`;
    }

    // Standalone embed: load ?embed=circular in the second iframe — the whole
    // page boots into only the circular view. Once it posts its map-ready
    // handshake, push the same layers/title/view into it.
    function openStandaloneEmbed() {
      const message = buildOpenCircular({ withView: true });
      embedFrame.style.display = '';

      function onReady(event) {
        if (event.source !== embedFrame.contentWindow) return;
        if (!event.data || event.data.type !== 'map-ready') return;
        window.removeEventListener('message', onReady);
        embedFrame.contentWindow.postMessage(message, '*');
        log.textContent = `Standalone embed ready → sent ${JSON.stringify(message)}`;
      }
      window.addEventListener('message', onReady);

      // (Re)load the embed URL so a fresh map-ready fires even on re-open.
      embedFrame.src = 'http://localhost:5173/?embed=circular';
      log.textContent = 'Loading standalone embed (?embed=circular)…';
    }

    // ---- Stepwise filter demo against the circular embed iframe ----------

    // Full filter from the step inputs (only non-empty levels).
    function buildStepFilter() {
      const filter = {};
      const gemeente = document.getElementById('step-gemeente').value.trim();
      const wijk = document.getElementById('step-wijk').value.trim();
      const buurt = document.getElementById('step-buurt').value.trim();
      if (gemeente) filter.Gemeente = gemeente;
      if (wijk) filter.Wijk = wijk;
      if (buurt) filter.Buurt = buurt;
      return filter;
    }

    // Step 1: (re)load ?embed=circular, then push the full filter once the embed
    // reports ready. The map zooms in to the finest selected level.
    function openStepEmbed() {
      const filter = buildStepFilter();
      embedFrame.style.display = '';

      function onReady(event) {
        if (event.source !== embedFrame.contentWindow) return;
        if (!event.data || event.data.type !== 'map-ready') return;
        window.removeEventListener('message', onReady);
        embedFrame.contentWindow.postMessage(
          { type: 'open-circular', layers: ['aandeel_geschikt_2024'], filter },
          '*'
        );
        log.textContent = `Embed ready → open-circular + filter ${JSON.stringify(filter)}`;
      }
      window.addEventListener('message', onReady);

      embedFrame.src = 'http://localhost:5173/?embed=circular';
      log.textContent = 'Loading circular embed for stepwise filter…';
    }

    // Steps 2-4: remove one level from the embed's filter. Removing the last
    // level flies back to the app's default view.
    function stepRemove(level) {
      if (!embedFrame.contentWindow) return;
      const filter = { [level]: null };
      embedFrame.contentWindow.postMessage({ type: 'map-command', filter }, '*');
      log.textContent = `Embed filter change: ${JSON.stringify(filter)}`;
    }
  </script>
</body>
</html>
