<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>de Ronde kaart</title>
    <link rel="preload" as="image" type="image/svg+xml" href="/logo.svg" />
    <!-- Google Maps JS is loaded on demand by the Street View panel
         (street-view.tsx), not up front on every page load. -->

    <!-- Boot splash. Markup and styles stay inline on purpose: both stylesheets
         and the app bundle are render-blocking, so on a slow connection nothing
         paints for ~4s. A splash rendered by Solid, or styled from an external
         sheet, would arrive with the thing it is meant to cover. The artwork is
         the one external part — preloaded above so the request is already in
         flight by the time the element parses. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        transition: opacity 0.25s ease;
      }
      /* Must outrank the `display: flex` above — a bare [hidden] attribute
         loses to it, which is the classic way a splash gets stuck on screen. */
      #splash[hidden] {
        display: none;
      }
      #splash.is-hiding {
        opacity: 0;
      }
      #splash img {
        width: min(60vw, 340px);
        height: auto;
      }
      @media (prefers-reduced-motion: reduce) {
        #splash {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- References public/logo.svg directly so there is one source of truth for
         the artwork. `public/` is copied verbatim and served from the site root, so
         this is a same-origin request the browser starts while the render-blocking
         CSS and bundle are still in flight — it does not delay the paint this
         splash exists to win. -->
    <div id="splash" role="status" aria-label="Kaart wordt geladen">
      <img src="/logo.svg" alt="de Ronde kaart" width="566" height="212" />
    </div>
    <div id="root"></div>
    <!-- Last-resort dismissal. Deliberately NOT in the bundle: if main.tsx
         fails to parse or throws before it can hide the splash, this is the
         only path left, and a permanent logo over a broken app is worse than
         showing the broken app. -->
    <script>
      setTimeout(function () {
        var el = document.getElementById("splash");
        if (el) el.remove();
      }, 12000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
