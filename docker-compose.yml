services:
  mapapp:
    build: .
    ports:
      - "${MAP_PORT:-8080}:80"
    volumes:
      # Mount your instance-specific layers.json into the container
      - ./deploy/layers.example.json:/etc/mapapp/layers.json:ro
    restart: unless-stopped

  # Collaborative-annotation WebSocket server (Hocuspocus + SQLite). The map
  # app reaches it same-origin via nginx's /collab proxy location.
  collab:
    build: ./collab-server
    volumes:
      - collab-data:/data
    environment:
      - PORT=5174
      - DB_PATH=/data/annotations.db
      # Overload / storage guards — all optional; safe finite defaults apply if
      # unset. See collab-server/README.md "Abuse & overload guards".
      # - MAX_DOC_BYTES=2097152          # per-room persisted-blob cap (2 MB)
      # - MAX_ANNOTATIONS=300            # per-room annotation count
      # - MAX_TITLE_LEN=200
      # - MAX_DESC_LEN=2000
      # - MAX_POLY_POINTS=500
      # - MAX_SNAPSHOT_BYTES=131072      # embedded snapshot cap (128 KB)
      # - RATE_WINDOW_MS=10000
      # - RATE_MAX_BYTES_PER_WINDOW=8388608
      # - RATE_MAX_MSGS_PER_WINDOW=2000
      # - ROOM_TTL_DAYS=90               # idle-room GC retention
      # - GC_INTERVAL_MS=86400000        # GC cadence (daily)
      # - DB_SIZE_WARN_BYTES=536870912   # warn threshold (512 MB)
    restart: unless-stopped

volumes:
  collab-data:
