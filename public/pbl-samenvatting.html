<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samenvatting Startanalyse</title>

    <!--
      PBL's "Samenvatting Startanalyse" viewer, served from THIS origin.

      Why a local copy at all: PBL's page has no URL parameters and no
      postMessage API, and a cross-origin iframe cannot be scripted, so an
      embedded copy can never be told which neighbourhood to show. Serving their
      markup from our own origin makes it same-origin, and the small script at
      the bottom can then drive their own selection flow.

      Everything except this file still comes from PBL: <base> below points every
      relative script, stylesheet and data path back at their server (all of it
      CORS-open), so no code or data is mirrored here and their page stays the
      single source of truth. Consequently this file must be kept in step with
      the <body> markup and script list of:
        https://infographics.pbl.nl/startanalyse/2024/samenvatting/
    -->
    <base href="https://infographics.pbl.nl/startanalyse/2024/samenvatting/">

    <script>
      /*
       * PBL renders the neighbourhood polygons in a Web Worker
       * (L.vectorGrid.slicer -> js/thirdparty/webworker.js). `new Worker()`
       * rejects a cross-origin script URL, and with <base> pointing at PBL every
       * worker URL is cross-origin. Without this shim the summary text still
       * fills in, but no outlines are drawn and the map never zooms — a failure
       * that looks like a data problem rather than a security one.
       *
       * The worker script is served with `Access-Control-Allow-Origin: *`, so it
       * can be fetched and re-created as a same-origin blob.
       */
      (function () {
        var NativeWorker = window.Worker;
        window.Worker = function (url, options) {
          var absolute = new URL(url, document.baseURI).href;
          if (absolute.indexOf(window.location.origin) === 0) {
            return new NativeWorker(absolute, options);
          }
          var request = new XMLHttpRequest();
          // Synchronous on purpose: the Worker constructor has to return an
          // object, so the source cannot be awaited.
          request.open("GET", absolute, false);
          request.send();
          var blob = new Blob([request.responseText], { type: "application/javascript" });
          return new NativeWorker(URL.createObjectURL(blob), options);
        };
      })();
    </script>

    <script src="js/thirdparty/d3.v5.js"></script>
    <script src="js/thirdparty/leaflet.js"></script>
    <script src="js/thirdparty/leaflet_vectorgrid_msie.js"></script>
    <script src="js/thirdparty/leaflet_snogylop.js"></script>
    <script src="js/thirdparty/turf.min.js"></script>
    <script src="js/thirdparty/oms.js"></script>
    <link rel="stylesheet" href="css/handmatig.css">
    <link rel="stylesheet" href="css/leaflet.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="lnmapviewer-container" id="lnmapviewer-container">
        <div class="lnmapviewer-controls" id="lnmapviewer-controls"></div>
        <div class="lnmap_canvas" id=lnmap_canvas>
            <div class="grid-maps" id="grid-maps">
                <div class="grid-item" id="map_1">
                    <div class="map_overlay" id="map_overlay_1"></div>
                    <div class="map_leaflet" id="map_leaflet_1"></div>
                </div>
                <div class="grid-item" id="map_2">
                    <div class="map_overlay" id="map_overlay_2"></div>
                    <div class="map_leaflet" id="map_leaflet_2"></div>
                </div>
                <div class="grid-item" id="map_3">
                    <div class="map_overlay" id="map_overlay_3"></div>
                    <div class="map_leaflet" id="map_leaflet_3"></div>
                </div>
                <div class="grid-item" id="map_4">
                    <div class="map_overlay" id="map_overlay_4"></div>

                </div>
            </div>

    <script src="js/textinput.js"></script>
    <script src="tabcontent/tab_hoofd.js"></script>

    <script src="kaartenbak_buurtselectie.js"></script>
    <script src="kaartenbak_buurtberichten.js"></script>
    <script src="kaartenbak_maps.js"></script>
    <script src="popup_strategie.js"></script>

    <script>kaartenbak_init()</script>

    <script>
      /*
       * Drive PBL's own selection flow to the neighbourhood in our query string:
       * ?bu=<BU_CODE>. Their page exposes no API for this, so we operate its UI
       * the way a user would. Every step is a guess about markup we do not
       * control, and every step fails soft: if anything is missing the page is
       * left on its own gemeente picker, which still works by hand.
       *
       * The gemeente is derived from the buurt code rather than passed in. A CBS
       * code is "BU" + a 4-digit gemeente + a 4-digit buurt, so BU19040213 is
       * gemeente 1904 (Stichtse Vecht). That avoids depending on a gemeente name
       * from our own tiles, and avoids matching names at all: PBL's gemeente
       * table is Latin-1 and contains both commas and non-ASCII
       * ("Sudwest-Fryslan"), so name comparison is a needless failure mode.
       */
      (function () {
        var params = new URLSearchParams(window.location.search);
        var buurt = params.get("bu");
        if (!buurt || !/^BU\d{8}$/.test(buurt)) return;
        var gemeenteCode = "GM" + buurt.slice(2, 6);

        var GIVE_UP_MS = 60000;
        var POLL_MS = 150;

        /** Resolve once `test()` is truthy, or reject after GIVE_UP_MS. */
        function waitFor(test, what) {
          return new Promise(function (resolve, reject) {
            var deadline = Date.now() + GIVE_UP_MS;
            (function poll() {
              var value;
              try {
                value = test();
              } catch (err) {
                // A global the page has not defined yet reads as "not ready".
                value = null;
              }
              if (value) return resolve(value);
              if (Date.now() > deadline) return reject(new Error("timeout waiting for " + what));
              window.setTimeout(poll, POLL_MS);
            })();
          });
        }

        // The gemeente dropdown is filled from a CSV, so it starts empty.
        waitFor(function () {
          var select = document.getElementById("dd_gemeente");
          return select && select.options.length > 1 ? select : null;
        }, "dd_gemeente")
          .then(function (select) {
            // laadtgemeente() resolves the code from the dropdown's VALUE, which
            // is the gemeente name, so the code has to be turned back into the
            // exact option text. Reading it off the loaded <option>s uses the
            // page's own parse of its CSV — no second fetch, no encoding guess.
            return d3.csv("assets/data/csv/gemeenten_2024.csv").then(function (rows) {
              var row = rows.filter(function (r) { return r.gm_code === gemeenteCode; })[0];
              if (!row) throw new Error("unknown gemeente " + gemeenteCode);
              return { select: select, naam: row.gm_naam };
            });
          })
          .then(function (found) {
            var select = found.select;
            select.value = found.naam;
            if (select.value !== found.naam) {
              throw new Error('gemeente "' + found.naam + '" not in the list');
            }
            select.dispatchEvent(new Event("change"));

            // START is an SVG <rect>, not a button, and setting the dropdown
            // alone does nothing — the page gates loading behind this click.
            var start = document.getElementById("startknop_rect");
            if (!start) throw new Error("no start button");
            var box = start.getBoundingClientRect();
            ["mousedown", "mouseup", "click"].forEach(function (type) {
              start.dispatchEvent(
                new MouseEvent(type, {
                  bubbles: true,
                  view: window,
                  clientX: box.left + box.width / 2,
                  clientY: box.top + box.height / 2,
                }),
              );
            });

            // The gemeente's neighbourhood polygons are a ~10MB GeoJSON, and
            // markeerBuurt reads them synchronously — calling it early throws.
            return waitFor(function () {
              return window.dataset_buurtenpolygons && window.dataset_buurtenpolygons.features;
            }, "dataset_buurtenpolygons");
          })
          .then(function () {
            if (typeof window.markeerBuurt !== "function") {
              throw new Error("no markeerBuurt");
            }
            window.markeerBuurt(buurt);
          })
          .catch(function (err) {
            // Deliberately non-fatal: the viewer is fully usable by hand, so a
            // failed auto-select should degrade to that rather than blank out.
            console.warn("PBL auto-select failed:", err && err.message);
          });
      })();
    </script>
</body>
</html>
