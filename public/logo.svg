<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 566 212" role="img" aria-label="De Ronde Kaart">
  <!-- The ring turns clockwise, once every 6s. This lives inside the asset
       rather than in index.html because the boot splash draws the logo with
       <img src="/logo.svg">, which renders it as an isolated document: the
       host page's CSS cannot reach these elements, but the SVG's own can.

       The rotation is applied to a group that is already translated so the
       ring's centre sits at the local origin (see the nested <g> below), so
       the spin needs no transform-origin at all. That matters: transform-origin
       on an SVG element resolves against the element's own bounding box unless
       transform-box says otherwise, and getting that wrong offsets the pivot
       and makes the mark orbit instead of spin. Pivoting about the local
       origin sidesteps the whole question. -->
  <style>
    .ring-spin {
      animation: rondekaart-spin 6s linear infinite;
    }
    @keyframes rondekaart-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    /* Mirrors the same guard on the splash itself (index.html). */
    @media (prefers-reduced-motion: reduce) {
      .ring-spin { animation: none; }
    }
  </style>
  <!-- The mark is sized and placed to match the wordmark beside it: its
       diameter (189.2) equals the text's cap-height block, from the top of the
       "D" down to the baseline of "Kaart" (y 18.8 to 208), and its centre sits
       on that block's centre. Cap height rather than the full
       ascender-to-descender box is the right measure here because all three
       lines are capitals with no descenders, so the caps are what the eye
       reads as the text's height.

       Nesting, outermost first:
         translate  - put the mark's centre where it belongs on the canvas
         ring-spin  - rotate about that centre (no transform-origin needed)
         scale      - grow the artwork from its natural 179.71 to 189.2
         translate  - bring the artwork's own centre to the local origin
         translate/scale - the original artwork transform, untouched -->
  <g transform="translate(100.66 113.4)">
    <g class="ring-spin">
      <g transform="scale(1.052807)">
        <g transform="translate(-95.92 -106.76)">
