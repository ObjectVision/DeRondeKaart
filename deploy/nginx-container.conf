server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Config JSONs (map/layers/filter/charts/navigation) are baked into the
    # build via the config overlay (VITE_CONFIG_PROJECT); they are served as
    # normal static files from the webroot below — no runtime mount needed.

    # Static assets (JS, CSS, images) — long cache, immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Collaborative-annotation WebSocket — proxied to the collab service so
    # the browser connects same-origin (ws(s)://<host>/collab).
    location /collab {
        proxy_pass http://collab:5174;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;
}
