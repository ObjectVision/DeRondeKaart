server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve layers.json from the mounted config directory
    location = /layers.json {
        alias /etc/mapapp/layers.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    # Static assets (JS, CSS, images) — long cache, immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Collaborative-annotation WebSocket — proxied to the collab service so
    # the browser connects same-origin (ws(s)://<host>/collab).
    location /collab {
        proxy_pass http://collab:5174;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;
}
