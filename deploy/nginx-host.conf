# Nginx host site config for the map application.
# Place this file in /etc/nginx/sites-available/ and symlink to sites-enabled/.
#
# Serves:
#   - Static map data files (parquet, arrow, pbf, tif) from a local directory
#   - Reverse proxy to the Docker container running the app
#
# Replace the placeholders below:
#   maps.example.com  → your domain
#   /srv/mapdata       → directory containing your static map data files
#   localhost:8080     → Docker container host:port (matches MAP_PORT in docker-compose)

server {
    listen 80;
    server_name maps.example.com;

    # --- Static map data files ---
    # Serves files like /data/layer.parquet, /data/tiles/{z}/{x}/{y}.pbf
    location /data/ {
        alias /srv/mapdata/;
        autoindex off;

        # MIME types for geo data formats
        types {
            application/x-parquet        parquet;
            application/vnd.apache.arrow arrow arrows feather;
            application/x-protobuf       pbf;
            image/tiff                   tif tiff;
            application/json             json geojson;
        }

        # CORS — allow the app to fetch data cross-origin
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Content-Type" always;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length" always;

        # Support range requests (needed for partial Parquet reads)
        add_header Accept-Ranges bytes always;

        # Caching — data files are immutable, cache aggressively
        expires 30d;
        add_header Cache-Control "public, immutable" always;

        # Handle preflight OPTIONS
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers "Range, Content-Type";
            add_header Content-Length 0;
            return 204;
        }
    }

    # --- Collaborative-annotation WebSocket ---
    # Passed through to the container's nginx (which forwards to the collab
    # service); needs the Upgrade headers the general proxy below doesn't set.
    location /collab {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # --- Reverse proxy to the Docker container ---
    location / {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/x-protobuf
        image/svg+xml;
}

# --- SSL/TLS (uncomment after running certbot) ---
# After obtaining a certificate:
#   sudo certbot --nginx -d maps.example.com
#
# Certbot will modify this file to add the SSL block. Alternatively,
# use the manual config below:
#
# server {
#     listen 443 ssl http2;
#     server_name maps.example.com;
#
#     ssl_certificate     /etc/letsencrypt/live/maps.example.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/maps.example.com/privkey.pem;
#     include             /etc/letsencrypt/options-ssl-nginx.conf;
#     ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
#
#     # ... same location blocks as above ...
# }
#
# server {
#     listen 80;
#     server_name maps.example.com;
#     return 301 https://$host$request_uri;
# }
